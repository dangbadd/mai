# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit is one of four review layers; see docs/agents/review-pipeline.md for who owns what.
language: en-US

reviews:
  profile: chill
  # Keep the summary in CodeRabbit's own walkthrough comment, never in the PR body.
  high_level_summary_in_walkthrough: true
  poem: false
  # Spec conformance belongs to the code-review workflow.
  assess_linked_issues: false
  auto_review:
    # Only release PRs into main; ticket PRs into release/* get CI and local ponytail-review only.
    base_branches: ["^main$"]
    drafts: false
  tools:
    # CI already runs clippy with -D warnings.
    clippy:
      enabled: false
  pre_merge_checks:
    # The pr-title workflow owns titles; the pr skill owns descriptions.
    title:
      mode: "off"
    description:
      mode: "off"
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"
  finishing_touches:
    # Fixes are pushed by the session watching the PR; a second pusher would collide with it.
    autofix:
      enabled: false
    fix_ci:
      enabled: false
  path_filters:
    - "!assets/**/*.png"
    - "!Cargo.lock"
  path_instructions:
    - path: "**/*"
      instructions: |
        Review only for defects that show up when Mai runs: wrong behaviour, crashes and panics,
        unsound `unsafe` or FFI, Win32 handles or GDI objects that leak or are used after release,
        swallowed errors, and security problems.
        Do not comment on:
        - formatting or lints (CI runs rustfmt and clippy);
        - whether the change follows CLAUDE.md, GLOSSARY.md, docs/adr or the linked issues
          (the code-review workflow owns that);
        - over-engineering, line count or simplifications (ponytail-review runs before every ticket PR);
        - the comment that starts with `<!-- mai-code-review -->`.

knowledge_base:
  code_guidelines:
    # Repo standards are judged by the code-review workflow, not here.
    enabled: false

chat:
  auto_reply: false
